<html lang="en">
<head>
<meta charset="UTF-8">

<title>DIVYANSH 3D Quiz</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,sans-serif;color:white;
 background:radial-gradient(circle at top,#253b70,#10152d 48%,#080b18);
 overflow-x:hidden
}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{
 position:relative;z-index:1;min-height:100vh;display:flex;
 flex-direction:column;align-items:center;padding:24px 14px 14px
}
.panel{
 width:min(760px,100%);margin:auto;background:rgba(12,18,42,.86);
 border:1px solid rgba(255,255,255,.18);border-radius:24px;
 padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.35);
 backdrop-filter:blur(10px)
}
h1{
 font-size:clamp(2.5rem,8vw,4.8rem);text-align:center;margin:0 0 8px;
 letter-spacing:3px;background:linear-gradient(90deg,#56e0ff,#b68cff,#ff79c6);
 -webkit-background-clip:text;background-clip:text;color:transparent
}
.subtitle{text-align:center;color:#cbd5ff;margin:0 0 25px}
h2{text-align:center;margin-top:0}
.class-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
button{font:inherit;border:0;border-radius:13px;padding:13px 16px;
 font-weight:700;color:#10152d;background:linear-gradient(135deg,#69e5ff,#b7a0ff);
 cursor:pointer;transition:transform .15s,filter .15s}
button:hover{transform:translateY(-2px);filter:brightness(1.08)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.class-btn{min-height:54px}
.primary{display:block;width:100%;margin-top:18px;font-size:1.05rem}
.secondary{background:#27345f;color:white;border:1px solid #53618f}
.footer{width:100%;text-align:center;color:#b8c3e9;font-size:12px;
 padding:18px 0 4px;letter-spacing:.5px}
.hidden{display:none!important}
.topline{display:flex;justify-content:space-between;gap:12px;
 align-items:center;flex-wrap:wrap;margin-bottom:18px;color:#dce4ff}
.pill{background:#202d55;border:1px solid #465784;padding:9px 13px;
 border-radius:999px;font-weight:700}
.progress{height:9px;background:#263154;border-radius:20px;
 overflow:hidden;margin:10px 0 22px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#59e1ff,#c18cff);
 transition:width .2s}
.question{font-size:clamp(1.25rem,4vw,1.8rem);line-height:1.35;
 text-align:center;margin:20px 0 24px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{min-height:58px;background:#26345f;color:white;
 border:1px solid #586b9e;text-align:left}
.answer.correct{background:#176b55;border-color:#47e0a6}
.answer.wrong{background:#803b52;border-color:#ff8eae}
.feedback{text-align:center;min-height:28px;color:#d9e5ff;
 margin:16px 0 4px;font-weight:700}
.result{text-align:center}
.score{font-size:2.3rem;font-weight:900;color:#75e6ff;margin:14px}
.result-message{font-size:1.35rem;line-height:1.5;margin:20px 0;
 padding:18px;background:#202d55;border-radius:16px}
@media(max-width:520px){
 .panel{padding:20px 16px}
 .class-grid{grid-template-columns:repeat(3,1fr)}
 .answers{grid-template-columns:1fr}
 .topline{justify-content:center}
}
</style>
</head>

<body>
<canvas id="scene"></canvas>

<div class="app">

<!-- MAIN MENU -->
<main class="panel" id="menu">
 <h1>DIVYANSH</h1>
 <p class="subtitle">✨ 3D Quiz Challenge • Choose your class and test your knowledge! ✨</p>
 <h2>Select Your Class</h2>
 <div class="class-grid" id="classes"></div>
 <p class="subtitle" style="margin:22px 0 0">
  15 questions • Random order • 15 seconds each
 </p>
</main>

<!-- QUIZ PAGE -->
<main class="panel hidden" id="quiz">
 <div class="topline">
  <span class="pill" id="classLabel">Class</span>
  <span class="pill" id="questionCount">Question 1 / 15</span>
  <span class="pill" id="timer">⏱ 15</span>
  <span class="pill" id="scoreLabel">⭐ 0</span>
 </div>

 <div class="progress"><div class="bar" id="progress"></div></div>
 <div class="question" id="questionText"></div>
 <div class="answers" id="answers"></div>
 <div class="feedback" id="feedback"></div>
 <button class="primary hidden" id="nextBtn">Next Question ➜</button>
</main>

<!-- RESULT PAGE -->
<main class="panel result hidden" id="result">
 <h1 style="font-size:clamp(2.2rem,7vw,3.6rem)">QUIZ COMPLETE!</h1>
 <div class="score" id="finalScore"></div>
 <p id="resultStats"></p>
 <div class="result-message" id="resultMessage"></div>
 <button class="primary" id="restartBtn">Play Again 🔁</button>
 <button class="primary secondary" id="homeBtn">Change Class</button>
</main>

<!-- FOOTER ON EVERY PAGE -->
<footer class="footer">
 Creator – DIVYANSH | Published – DIVYANSH
</footer>

</div>

const menu=document.getElementById('menu');
const quiz=document.getElementById('quiz');
const result=document.getElementById('result');
const classes=document.getElementById('classes');

let selectedClass=1,questions=[],index=0,score=0,timer=15,interval=null,locked=false;

for(let c=1;c<=12;c++){
 const b=document.createElement('button');
 b.className='class-btn';
 b.textContent='Class '+c;
 b.addEventListener('click',()=>startQuiz(c));
 classes.appendChild(b);
}

function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function show(el){
 menu.classList.add('hidden');
 quiz.classList.add('hidden');
 result.classList.add('hidden');
 el.classList.remove('hidden');
}

function startQuiz(c){
 selectedClass=c;
 questions=shuffle(questionBank[c]).slice(0,15);
 index=0;
 score=0;
 document.getElementById('classLabel').textContent='Class '+c;
 document.getElementById('scoreLabel').textContent='⭐ 0';
 show(quiz);
 renderQuestion();
}

function renderQuestion(){
 locked=false;
 timer=15;
 document.getElementById('timer').textContent='⏱ '+timer;
 document.getElementById('questionCount').textContent=`Question ${index+1} / 15`;
 document.getElementById('progress').style.width=(index/15*100)+'%';

 const q=questions[index];
 document.getElementById('questionText').textContent=q[0];
 document.getElementById('feedback').textContent='';
 document.getElementById('nextBtn').classList.add('hidden');

 const box=document.getElementById('answers');
 box.innerHTML='';

 shuffle(q[1]).forEach(choice=>{
  const b=document.createElement('button');
  b.className='answer';
  b.textContent=choice;
  b.addEventListener('click',()=>answer(choice,b));
  box.appendChild(b);
 });

 clearInterval(interval);
 interval=setInterval(()=>{
  timer--;
  document.getElementById('timer').textContent='⏱ '+timer;
  if(timer<=0){
   clearInterval(interval);
   answer(null,null);
  }
 },1000);
}

function answer(choice,button){
 if(locked)return;
 locked=true;
 clearInterval(interval);

 const q=questions[index];
 const correct=q[2];
 const buttons=[...document.querySelectorAll('.answer')];

 buttons.forEach(b=>{
  b.disabled=true;
  if(b.textContent===correct)b.classList.add('correct');
 });

 if(choice===correct){
  score++;
  document.getElementById('feedback').textContent='Correct! 🎉';
 }else{
  if(button)button.classList.add('wrong');
  document.getElementById('feedback').textContent=
   choice===null?'Time is up! ⏰':'Not quite! The correct answer is '+correct;
 }

 document.getElementById('scoreLabel').textContent='⭐ '+score;
 document.getElementById('nextBtn').textContent=
  index===14?'See Results 🏁':'Next Question ➜';
 document.getElementById('nextBtn').classList.remove('hidden');
}

document.getElementById('nextBtn').addEventListener('click',()=>{
 index++;
 if(index<15)renderQuestion();
 else finishQuiz();
});

function finishQuiz(){
 clearInterval(interval);
 show(result);

 const incorrect=15-score;
 document.getElementById('finalScore').textContent=score+' / 15 ⭐';
 document.getElementById('resultStats').textContent=
  `Class ${selectedClass} • ${score} correct • ${incorrect} incorrect`;

 document.getElementById('resultMessage').textContent=
  score>=10
  ?`Ghop Ghop! You have ${incorrect} incorrect 😂 HAAHAHAAHA 🏆`
  :'Ghop Ghop, you are noob HAAHAHAAHA 🤣💀';
}

document.getElementById('restartBtn').addEventListener('click',()=>{
 startQuiz(selectedClass);
});

document.getElementById('homeBtn').addEventListener('click',()=>{
 show(menu);
});
</script>

<!-- 3D BACKGROUND -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
try{
 if(window.THREE){
  const canvas=document.getElementById('scene');
  const renderer=new THREE.WebGLRenderer({
   canvas,alpha:true,antialias:true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
  camera.position.z=18;

  const shapes=[];
  const geometry=[
   new THREE.IcosahedronGeometry(1,0),
   new THREE.TorusGeometry(.8,.25,8,18),
   new THREE.OctahedronGeometry(1,0)
  ];

  for(let i=0;i<22;i++){
   const material=new THREE.MeshStandardMaterial({
    color:[0x58dfff,0xa98cff,0xff75c8][i%3],
    roughness:.35,metalness:.25,transparent:true,opacity:.55
   });
   const mesh=new THREE.Mesh(geometry[i%3],material);
   mesh.position.set(
    (Math.random()-.5)*28,
    (Math.random()-.5)*18,
    (Math.random()-.5)*12
   );
   mesh.scale.setScalar(.4+Math.random()*.8);
   scene.add(mesh);
   shapes.push(mesh);
  }

  scene.add(new THREE.AmbientLight(0xffffff,.8));
  const light=new THREE.PointLight(0xffffff,1.5);
  light.position.set(5,8,10);
  scene.add(light);

  function resize(){
   renderer.setSize(innerWidth,innerHeight);
   camera.aspect=innerWidth/innerHeight;
   camera.updateProjectionMatrix();
  }

  window.addEventListener('resize',resize);
  resize();

  function animate(){
   requestAnimationFrame(animate);
   shapes.forEach((s,i)=>{
    s.rotation.x+=.001+(i%3)*.0005;
    s.rotation.y+=.002;
    s.position.y+=Math.sin(Date.now()*.0004+i)*.0008;
   });
   renderer.render(scene,camera);
  }
  animate();
 }
}catch(e){
 console.log('3D background unavailable; quiz remains playable.');
}
</script>
